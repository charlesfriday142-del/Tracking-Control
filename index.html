<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tracking Control</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101820;
  color: white;
}

header {
  background: #17232e;
  padding: 20px;
  border-bottom: 2px solid #d4a017;
}

h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin-bottom: 0;
  color: #bfc7ce;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #17232e;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 14px;
  border-radius: 8px;
  border: 1px solid #52606d;
  background: #101820;
  color: white;
  font-size: 16px;
}

textarea {
  min-height: 90px;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: none;
  border-radius: 8px;
  background: #d4a017;
  color: #111;
  font-size: 17px;
  font-weight: bold;
}

.notice {
  color: #bfc7ce;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <h1>Tracking Control</h1>
  <p>Private shipment management dashboard</p>
</header>

<div class="container">

  <div class="card">
    <h2>Create / Update Shipment</h2>

    <label>Tracking Number</label>
    <input type="text" placeholder="Enter tracking number">

    <label>Sender Name</label>
    <input type="text" placeholder="Enter sender name">

    <label>Receiver Name</label>
    <input type="text" placeholder="Enter receiver name">

    <label>Current Location</label>
    <input type="text" placeholder="Example: London, United Kingdom">

    <label>Shipment Status</label>
    <select>
      <option>Shipment Created</option>
      <option>Package Received</option>
      <option>In Transit</option>
      <option>At Distribution Center</option>
      <option>Out for Delivery</option>
      <option>Delivered</option>
      <option>Delivery Exception</option>
    </select>

    <label>Shipment Update</label>
    <textarea placeholder="Enter the latest shipment update"></textarea>

    <button>Save Shipment</button>
  </div>

  <div class="card">
    <h2>Route / Map Position</h2>

    <label>Latitude</label>
    <input type="text" placeholder="Example: 51.5074">

    <label>Longitude</label>
    <input type="text" placeholder="Example: -0.1278">

    <p class="notice">
      Map integration will be connected in the next step.
    </p>

    <button>Update Package Position</button>
  </div>

</div>

</body>
</html>
