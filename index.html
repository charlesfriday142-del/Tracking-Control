<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tracking Control Admin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101820;
  color: white;
}

header {
  background: #17232e;
  padding: 20px;
  border-bottom: 2px solid #d4a017;
}

h1 {
  margin: 0;
  font-size: 26px;
}

header p {
  color: #bfc7ce;
  margin-bottom: 0;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #17232e;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

h2 {
  margin-top: 0;
  color: #d4a017;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #40505c;
  border-radius: 8px;
  background: #101820;
  color: white;
  font-size: 16px;
}

textarea {
  height: 100px;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: none;
  border-radius: 8px;
  background: #d4a017;
  color: #101820;
  font-size: 17px;
  font-weight: bold;
}

.notice {
  color: #bfc7ce;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <h1>Tracking Control</h1>
  <p>Private shipment management system</p>
</header>

<div class="container">

  <div class="card">
    <h2>Create / Update Shipment</h2>

    <label>Tracking Number</label>
    <input type="text" id="trackingNumber" placeholder="Enter tracking number">

    <label>Customer Name</label>
    <input type="text" id="customerName" placeholder="Enter customer name">

    <label>Shipment Status</label>
    <select id="status">
      <option>Shipment Created</option>
      <option>Package Received</option>
      <option>In Transit</option>
      <option>Out for Delivery</option>
      <option>Delivered</option>
    </select>

    <label>Current Location</label>
    <input type="text" id="location" placeholder="Example: Milan, Italy">

    <label>Destination</label>
    <input type="text" id="destination" placeholder="Example: Lagos, Nigeria">

    <label>Shipment Update</label>
    <textarea id="update" placeholder="Enter the latest shipment update"></textarea>

    <button onclick="saveShipment()">Save Shipment</button>
  </div>

  <div class="card">
    <h2>Admin Notice</h2>
    <p class="notice">
      This is the private shipment configuration page.
      Do not use this to represent simulated locations as real live GPS tracking.
    </p>
  </div>

</div>

<script>
function saveShipment() {
  alert("Shipment details saved. Database connection will be added next.");
}
</script>

</body>
</html>
