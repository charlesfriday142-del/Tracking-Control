<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Track Your Shipment</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101820;
      color: white;
    }

    header {
      background: #17232e;
      padding: 20px;
      border-bottom: 2px solid #d4a017;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      color: #bfc7ce;
      margin: 8px 0 0;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: #17232e;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      color: #d4a017;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #40505c;
      border-radius: 8px;
      background: #101820;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #d4a017;
      color: #101820;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
    }

    .error {
      display: block !important;
      background: #4a1f25;
      color: #ffc4c8;
    }

    .loading {
      display: block !important;
      background: #243440;
      color: #dbe8f0;
    }

    #result {
      display: none;
    }

    .status-box {
      padding: 14px;
      border-radius: 8px;
      background: #101820;
      border-left: 4px solid #d4a017;
      margin-bottom: 18px;
    }

    .status-box strong {
      display: block;
      color: #d4a017;
      margin-bottom: 5px;
    }

    .info-row {
      border-bottom: 1px solid #40505c;
      padding: 14px 0;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #bfc7ce;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 17px;
      word-break: break-word;
    }

    .footer-note {
      text-align: center;
      color: #bfc7ce;
      font-size: 13px;
      margin-top: 25px;
    }
  </style>
</head>

<body>

<header>
  <h1>Shipment Tracking</h1>
  <p>Enter your tracking number to view your shipment status</p>
</header>

<div class="container">

  <div class="card">

    <h2>Track Shipment</h2>

    <label for="trackingNumber">Tracking Number</label>

    <input
      type="text"
      id="trackingNumber"
      placeholder="Enter your tracking number"
    >

    <button
      id="trackButton"
      onclick="trackShipment()"
    >
      Track Shipment
    </button>

    <div id="message"></div>

  </div>


  <div class="card" id="result">

    <h2>Shipment Details</h2>

    <div class="status-box">
      <strong>Current Status</strong>
      <span id="resultStatus"></span>
    </div>

    <div class="info-row">
      <div class="info-label">Tracking Number</div>
      <div class="info-value" id="resultTrackingNumber"></div>
    </div>

    <div class="info-row">
      <div class="info-label">Current Location</div>
      <div class="info-value" id="resultLocation"></div>
    </div>

    <div class="info-row">
      <div class="info-label">Destination</div>
      <div class="info-value" id="resultDestination"></div>
    </div>

    <div class="info-row">
      <div class="info-label">Latest Shipment Update</div>
      <div class="info-value" id="resultUpdate"></div>
    </div>

    <div class="info-row">
      <div class="info-label">Last Updated</div>
      <div class="info-value" id="resultLastUpdated"></div>
    </div>

  </div>


  <p class="footer-note">
    Please enter the tracking number provided for your shipment.
  </p>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* SUPABASE CONNECTION */

const SUPABASE_URL =
  "https://ojghoyeyhewapabbdtuc.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_WG8kcXceyGv1fhdSLEZKJw_ckl73g-i";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function showMessage(text, type) {

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className = type;

}


function hideMessage() {

  const message =
    document.getElementById("message");

  message.textContent = "";

  message.className = "";

}


/* TRACK SHIPMENT */

async function trackShipment() {

  const trackButton =
    document.getElementById("trackButton");

  const trackingNumber =
    document
      .getElementById("trackingNumber")
      .value
      .trim();


  /* HIDE OLD RESULT */

  document
    .getElementById("result")
    .style
    .display = "none";


  /* CHECK TRACKING NUMBER */

  if (!trackingNumber) {

    showMessage(
      "Please enter a tracking number.",
      "error"
    );

    return;

  }


  /* SHOW LOADING */

  showMessage(
    "Searching for your shipment...",
    "loading"
  );

  trackButton.disabled = true;

  trackButton.textContent =
    "Searching...";


  /* SEARCH SUPABASE */

  const { data, error } =
    await supabaseClient
      .from("shipments")
      .select("*")
      .eq(
        "tracking_number",
        trackingNumber
      )
      .maybeSingle();


  trackButton.disabled = false;

  trackButton.textContent =
    "Track Shipment";


  /* HANDLE ERROR */

  if (error) {

    console.error(error);

    showMessage(
      "Unable to retrieve shipment information.",
      "error"
    );

    return;

  }


  /* NO SHIPMENT FOUND */

  if (!data) {

    showMessage(
      "No shipment was found with that tracking number.",
      "error"
    );

    return;

  }


  /* HIDE MESSAGE */

  hideMessage();


  /* DISPLAY SHIPMENT */

  document
    .getElementById("resultTrackingNumber")
    .textContent =
    data.tracking_number || "-";


  document
    .getElementById("resultStatus")
    .textContent =
    data.status || "-";


  document
    .getElementById("resultLocation")
    .textContent =
    data.current_location || "-";


  document
    .getElementById("resultDestination")
    .textContent =
    data.destination || "-";


  document
    .getElementById("resultUpdate")
    .textContent =
    data.shipment_update || "No update available.";


  /* FORMAT DATE */

  if (data.last_updated) {

    const date =
      new Date(data.last_updated);

    document
      .getElementById("resultLastUpdated")
      .textContent =
      date.toLocaleString();

  } else {

    document
      .getElementById("resultLastUpdated")
      .textContent = "-";

  }


  /* SHOW RESULT */

  document
    .getElementById("result")
    .style
    .display = "block";

}


/* ALLOW ENTER KEY */

document
  .getElementById("trackingNumber")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        trackShipment();
      }

    }
  );

</script>

</body>
</html>
